[package]
name = "pelica"
version = "1.6.1"
edition = "2021"
description = "Tiered GPU + RAM + SSD inference engine for giant Mixture-of-Experts models"
license = "MIT"

[dependencies]
anyhow = "1"
memmap2 = "0.9"
rayon = "1.10"
serde_json = { version = "1", features = ["preserve_order"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan", "dx12"] }
pollster = "0.4"
regex = "1"
minijinja = { version = "3.0.1", features = ["loop_controls", "json", "builtins", "serde"] }
minijinja-contrib = { version = "3.0.1", features = ["pycompat"] }

# free VRAM on any GPU (DXGI), where nvidia-smi isn’t there
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
debug = "line-tables-only"
